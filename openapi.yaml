openapi: 3.1.0
info:
  title: Yacht Calendar Standard API
  version: "0.4"
  description: >
    Read-only API a central agent (CA) serves so partners can read its fleet,
    availability, calendar and seasons. Each key carries the access levels the CA
    granted; see ACCESS-LEVELS.md. No endpoint ever returns client names or other
    personal data.
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://api.example-ca.com
security:
  - bearerKey: []
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: >
        One key per person or system, belonging to one recipient. What it sees is set per yacht
        by the publisher's shares (SHARING.md); /v1/key lists it. Admin endpoints need a
        publisher key with scope admin.
  parameters:
    from: { name: from, in: query, schema: { type: string, format: date }, description: Return periods that end on or after this date }
    to: { name: to, in: query, schema: { type: string, format: date }, description: Return periods that start on or before this date }
    yachtId: { name: yacht_id, in: query, schema: { type: string } }
    updatedSince: { name: updated_since, in: query, schema: { type: string, format: date-time }, description: Only records changed after this UTC time }
    cursor: { name: cursor, in: query, schema: { type: string } }
  responses:
    InvalidKey:
      description: No key, unknown key, or an expired or revoked key
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { error: invalid_key } } }
    InsufficientScope:
      description: The key's level is too low for this endpoint
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { error: insufficient_scope, required: calendar:read } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [invalid_key, insufficient_scope, not_found, bad_request] }
        detail: { type: string }
        required: { type: string }
    Answer:
      type: object
      required: [summary, rules]
      description: Every AI-facing answer starts with a summary to relay and ends with the rules to follow
      properties:
        summary: { type: string }
        rules: { type: array, items: { type: string } }
      additionalProperties: true
    Access:
      type: object
      required: [profile, calendar, rates]
      properties:
        profile: { enum: [basic, full] }
        calendar: { enum: [none, busy, status, full] }
        rates: { enum: [none, seasons, full] }
    Key:
      type: object
      required: [ca, recipient, expires_at, yachts]
      properties:
        ca: { type: string }
        recipient: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        yachts:
          type: array
          items:
            type: object
            required: [id, access, months_ahead]
            properties:
              id: { type: string }
              access: { $ref: "#/components/schemas/Access" }
              months_ahead: { type: [integer, "null"], description: null = no limit }
    Recipient: { $ref: "schema/sharing.schema.json#/$defs/recipient" }
    Group: { $ref: "schema/sharing.schema.json#/$defs/group" }
    BoatSet: { $ref: "schema/sharing.schema.json#/$defs/boat_set" }
    Share: { $ref: "schema/sharing.schema.json#/$defs/share" }
    AdminKey: { $ref: "schema/sharing.schema.json#/$defs/key" }
    NewKey:
      allOf:
        - { $ref: "schema/sharing.schema.json#/$defs/key" }
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "The bearer token. Shown once, never again" }
    Preview:
      type: object
      required: [recipient, yachts]
      properties:
        recipient: { type: string }
        yachts:
          type: array
          items:
            type: object
            required: [id, shared]
            properties:
              id: { type: string }
              shared: { type: boolean }
              access: { $ref: "#/components/schemas/Access" }
              months_ahead: { type: [integer, "null"] }
              shares: { type: array, items: { type: string }, description: The shares that decided this yacht }
    Yacht: { $ref: "schema/yacht.schema.json" }
    Availability: { $ref: "schema/availability.schema.json" }
    Booking: { $ref: "schema/booking.schema.json" }
    Season: { $ref: "schema/season.schema.json" }
    Feed: { $ref: "schema/feed.schema.json" }
paths:
  /v1/key:
    get:
      summary: What this key can read, per yacht
      responses:
        "200": { description: The key's grant, content: { application/json: { schema: { $ref: "#/components/schemas/Key" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
  /v1/yachts:
    get:
      summary: Fleet list (level 1, fleet:read)
      parameters: [{ $ref: "#/components/parameters/cursor" }]
      responses:
        "200":
          description: Yachts this key covers
          content:
            application/json:
              schema:
                type: object
                required: [yachts]
                properties:
                  yachts: { type: array, items: { $ref: "#/components/schemas/Yacht" } }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/InvalidKey" }
  /v1/availability:
    get:
      summary: Busy periods (level 2, availability:read)
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/yachtId" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: Busy periods. A date with no period means no booking is recorded, not confirmed availability.
          content:
            application/json:
              schema:
                type: object
                required: [availability]
                properties:
                  availability: { type: array, items: { $ref: "#/components/schemas/Availability" } }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/bookings:
    get:
      summary: Bookings and holds with ports (level 3, calendar:read)
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/yachtId" }
        - { $ref: "#/components/parameters/updatedSince" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: Bookings, holds and unavailable periods
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings: { type: array, items: { $ref: "#/components/schemas/Booking" } }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/seasons:
    get:
      summary: Seasons, ports and rates (level 4, rates:read)
      parameters:
        - { $ref: "#/components/parameters/yachtId" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: Seasons
          content:
            application/json:
              schema:
                type: object
                required: [seasons]
                properties:
                  seasons: { type: array, items: { $ref: "#/components/schemas/Season" } }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/search:
    get:
      summary: Which yachts are free on these dates (for AI assistants; same as the MCP tool search_available)
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date }, description: Embarkation date }
        - { name: end, in: query, required: true, schema: { type: string, format: date }, description: Disembarkation date }
        - { name: guests, in: query, schema: { type: integer }, description: Minimum guests }
        - { name: area, in: query, schema: { type: string }, description: "Cruising area or port, e.g. Ionian" }
        - { name: yacht_type, in: query, schema: { type: string, enum: [motor, sail, catamaran, power_catamaran, gulet, motor_sailer, other] } }
        - { name: min_length, in: query, schema: { type: number }, description: Metres }
        - { name: max_length, in: query, schema: { type: number }, description: Metres }
        - { name: include_taken, in: query, schema: { type: boolean } }
      responses:
        "200": { description: "A summary line, counts, matching yachts (status free, on_hold, taken, no_calendar or beyond_window) and the rules to follow", content: { application/json: { schema: { $ref: "#/components/schemas/Answer" } } } }
        "400": { description: Bad input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
  /v1/routes:
    get:
      summary: Yachts already starting or ending at a port, or based or cruising in an area (same as the MCP tool find_routes)
      parameters:
        - { name: place, in: query, required: true, schema: { type: string }, description: "Port or area, e.g. Zakynthos" }
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: A summary line and matches, content: { application/json: { schema: { $ref: "#/components/schemas/Answer" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
  /v1/rate:
    get:
      summary: The season and weekly rate for a yacht on a start date (same as the MCP tool get_rate)
      parameters:
        - { name: yacht, in: query, required: true, schema: { type: string }, description: Yacht id or name }
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: A summary line and the rate, content: { application/json: { schema: { $ref: "#/components/schemas/Answer" } } } }
        "400": { description: Bad input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
  /v1/feed:
    get:
      summary: Everything this key may read, as one feed document
      responses:
        "200": { description: A feed at the key's level, content: { application/json: { schema: { $ref: "#/components/schemas/Feed" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
  /v1/admin/preview:
    get:
      summary: What a key or recipient would see, per yacht, and which shares decided it (scope admin)
      parameters:
        - { name: key, in: query, schema: { type: string } }
        - { name: recipient, in: query, schema: { type: string } }
      responses:
        "200": { description: Per-yacht access, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/recipients:
    get:
      summary: List companies and people (scope admin)
      responses:
        "200": { description: List, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Recipient" } } } } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    post:
      summary: Create one of the companies and people (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Recipient" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Recipient" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/recipients/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      summary: Replace one of the companies and people (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Recipient" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Recipient" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    delete:
      summary: Delete one of the companies and people (scope admin)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/groups:
    get:
      summary: List groups (scope admin)
      responses:
        "200": { description: List, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    post:
      summary: Create one of the groups (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/groups/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      summary: Replace one of the groups (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    delete:
      summary: Delete one of the groups (scope admin)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/boat-sets:
    get:
      summary: List boat sets (scope admin)
      responses:
        "200": { description: List, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/BoatSet" } } } } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    post:
      summary: Create one of the boat sets (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BoatSet" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BoatSet" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/boat-sets/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      summary: Replace one of the boat sets (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BoatSet" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/BoatSet" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    delete:
      summary: Delete one of the boat sets (scope admin)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/shares:
    get:
      summary: List shares (scope admin)
      responses:
        "200": { description: List, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Share" } } } } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    post:
      summary: Create one of the shares (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Share" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Share" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/shares/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      summary: Replace one of the shares (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Share" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Share" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    delete:
      summary: Delete one of the shares (scope admin)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/keys:
    get:
      summary: List keys, without secrets (scope admin)
      responses:
        "200": { description: List, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminKey" } } } } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
    post:
      summary: Issue a key to a recipient (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminKey" } } } }
      responses:
        "201": { description: "Created; the secret is in this response only", content: { application/json: { schema: { $ref: "#/components/schemas/NewKey" } } } }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
  /v1/admin/keys/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Revoke a key (scope admin)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
