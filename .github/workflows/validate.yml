name: validate
on: [push, pull_request]
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Examples and templates are up to date
        run: python3 tools/build_examples.py && git diff --exit-code
      - name: Validator on every example and template
        run: |
          for f in examples/feed-level-*.json templates/google-sheet/level-*; do python3 tools/validate.py "$f"; done
      - name: Self-test
        run: python3 tools/selftest.py
      - name: Examples against the JSON Schemas
        run: |
          pip install -q "jsonschema>=4.18" referencing pyyaml
          python3 tools/check_schemas.py
          python3 -c "import yaml; yaml.safe_load(open('openapi.yaml'))"
